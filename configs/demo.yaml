# 基本物理常数
g: 9.79  # 重力加速度 [m/s^2]

# 几何参数
R_w: 0.05    # 轮子半径 [m]
R_l: 0.15    # 轮距的一半 [m]
l_c: 0.001   # 质心偏移 [m]

# 腿部参数
leg_length: 0.12 # 腿长 [m]
l_l: 0.12         # 左腿总长 [m]
l_wl: 0.06       # 左腿轮子到关节距离 [m] (leg_length / 2)
l_bl: 0.06       # 左腿关节到身体距离 [m] (leg_length / 2)
l_r: 0.12         # 右腿总长 [m]
l_wr: 0.06       # 右腿轮子到关节距离 [m] (leg_length / 2)
l_br: 0.06       # 右腿关节到身体距离 [m] (leg_length / 2)
# 质量参数
m_w: 0.416   # 单个轮子质量 [kg]
m_l: 0.5  # 单条腿质量 [kg]
m_b: 1.064   # 身体质量 [kg]

# 转动惯量
I_w: 0.0005    # 轮子转动惯量 [kg·m^2] (0.5 * m_w * R_w^2)
I_z: 0.043448      # 绕z轴转动惯量 [kg·m^2]
I_b: 0.011668   # 机体绕pitch轴转动惯量 [kg·m^2] (m_b * (机体长^2 + 机体宽^2) / 12.0)
I_ll: 0.005524  # 左腿转动惯量 [kg·m^2]
I_lr: 0.005524  # 右腿转动惯量 [kg·m^2]

# LQR 控制器参数
lqr:
  # 状态限幅 - 用于归一化 Q 矩阵
  # 状态向量: [s, ds, phi, dphi, theta_ll, dtheta_ll, theta_lr, dtheta_lr, theta_b, dtheta_b]
  state_limits:
    s_max: 1.0                 # 位移最大值 [m]
    ds_max: 5.0                 # 线速度最大值 [m/s]
    phi_max: 3.14               # 偏航角最大值 [rad]
    dphi_max: 8.0               # 偏航角速度最大值 [rad/s]
    theta_ll_max: 0.7854        # 左腿角度最大值 [rad] (π/4)
    dtheta_ll_max: 12.0         # 左腿角速度最大值 [rad/s]
    theta_lr_max: 0.7854        # 右腿角度最大值 [rad] (π/4)
    dtheta_lr_max: 12.0         # 右腿角速度最大值 [rad/s]
    theta_b_max: 1.0472         # 俯仰角最大值 [rad] (π/3)
    dtheta_b_max: 8.0           # 俯仰角速度最大值 [rad/s]

  # 控制输入限幅 - 用于归一化 R 矩阵
  # 输入向量: [T_wl, T_wr, T_bl, T_br]
  control_limits:
    T_wl_max: 2.0               # 左轮驱动力矩最大值 [N·m]
    T_wr_max: 2.0               # 右轮驱动力矩最大值 [N·m]
    T_bl_max: 15.0              # 左腿关节力矩最大值 [N·m]
    T_br_max: 15.0              # 右腿关节力矩最大值 [N·m]

  Q_weights:
    s: 1.0                # 位移权重
    ds: 1.2               # 线速度权重
    phi: 0.8                # 偏航角权重
    dphi: 1.2               # 偏航角速度权重
    theta_ll: 20.0              # 左腿角度权重
    dtheta_ll: 20.0              # 左腿角速度权重
    theta_lr: 20.0              # 右腿角度权重
    dtheta_lr: 20.0              # 右腿角速度权重
    theta_b: 20.1                # 俯仰角权重
    dtheta_b: 1.8              # 俯仰角速度权重

  # R 矩阵权重（归一化前）
  # 这些值会被 (权重 / 限幅^2) 归一化
  R_weights:
    T_wl: 10.0                  # 左轮驱动力矩权重
    T_wr: 10.0                  # 右轮驱动力矩权重
    T_bl: 30.0                  # 左腿关节力矩权重
    T_br: 30.0                  # 右腿关节力矩权重


# 多项式拟合参数配置
fitting:
  # 腿部参数数据
  # 格式：每行 [l_l(腿长), l_wl(轮-质心), l_bl(机身-质心), I_ll(惯量)]
  # 单位：长度 [m]，惯量 [kg·m²]
  leg_data_l:
    - [0.12, 0.06, 0.06, 0.005524]   # 第 1 组数据
    - [0.14, 0.07, 0.07, 0.005972]   # 第 2 组数据
    - [0.16, 0.08, 0.08, 0.006498]   # 第 3 组数据
    - [0.18, 0.09, 0.09, 0.007103]   # 第 4 组数据
    - [0.20, 0.10, 0.10, 0.007788]   # 第 5 组数据
    - [0.22, 0.11, 0.11, 0.008554]   # 第 6 组数据
    - [0.24, 0.12, 0.12, 0.009404]   # 第 7 组数据
    - [0.26, 0.13, 0.13, 0.010338]   # 第 8 组数据

  # 右腿参数（默认与左腿相同，可单独配置）
  leg_data_r: null  # null 表示使用与 leg_data_l 相同的数据